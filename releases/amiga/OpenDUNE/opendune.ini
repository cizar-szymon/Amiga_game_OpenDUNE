; OpenDUNE for the Amiga - settings (all options: OpenDUNE_en.txt / OpenDUNE.txt)
; The same as Tool Types of the OpenDUNE icon (DATADIR=Work:Dune2/) win over this file.
[opendune]
; the Dune II PC data (.PAK files): the default is PROGDIR:data
;datadir=Work:Dune2/
; screen size when none was chosen in Options -> Resolution (that one wins); default 640x480
;screenmode=640x480
framerate=60
dune2_enhanced=1
; no intro at the start (must be 1 without INTRO.PAK)
skip_intro=1
; frames per second counter when not chosen in Options -> Game controls (that one wins)
;show_fps=1
; music recordings (PROGDIR:MUSIC) and their volume 0..64
;music_dir=PROGDIR:MUSIC
;music_volume=40
; LAN game: a line with the other players and their response time
;lan_info=1
; internet game and bug reports: another game server, host:port
;lan_relay=83.12.152.135:6810
; language: english (default), german (the .GER files in data) or polish (lang/POLISH.PAK);
; Options -> Game controls -> Language in the game wins
;language=polish
