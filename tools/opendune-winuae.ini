; OpenDUNE in WinUAE (OpenDUNE_A1200_OS32_net.uae: ODUNE: = build/amiga, DDATA: = data)
[opendune]
; the Dune II PC data (OpenDUNE/data on the PC, read only)
datadir=DDATA:
; saves in PROGDIR:saves (the default)
; screen mode: Options -> Resolution (kept); screenmode=WxH here wins
;screenmode=640x480
framerate=60
dune2_enhanced=1
; FPS counter in the bottom left corner (also F8)
show_fps=1
; test commands from tools/od.py (RAM:od-cmd)
debug_commands=1
; no intro at the start (Replay Introduction still plays it)
skip_intro=1
