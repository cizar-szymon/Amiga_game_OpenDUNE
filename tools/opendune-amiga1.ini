; OpenDUNE for the Warp (Amiga 1 install, WorkSD:Games/OpenDUNEWarp)
[opendune]
; the Dune II PC data of NovaCoder's OpenDUNE next to it (read only)
datadir=WorkSD:Games/OpenDUNE/data
; saves in PROGDIR:saves (the default)
; screen mode: Options -> Resolution (kept); screenmode=WxH here wins
;screenmode=640x480
framerate=60
dune2_enhanced=1
; FPS counter in the bottom left corner (also F8)
show_fps=1
; test commands from tools/od.py (RAM:od-cmd)
debug_commands=1
; no intro at the start (Replay Introduction still plays it)
skip_intro=1
; LAN game: a line over the FPS - the others, response time, "same <step>" (1 on)
;lan_info=1
