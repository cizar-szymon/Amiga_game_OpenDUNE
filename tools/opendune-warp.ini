; OpenDUNE for the Warp (Amiga 2 test install)
[opendune]
datadir=WorkSD:Games/OpenDUNE/data
savedir=WorkSD:Games/OpenDUNEWarp/saves
; screen mode: Options -> Resolution (kept); screenmode=WxH here wins
;screenmode=640x480
framerate=60
dune2_enhanced=1
; test commands from tools/od.py (RAM:od-cmd)
debug_commands=1
; FPS counter in the bottom right corner (also F8)
show_fps=1
; time by parts every 5 s into RAM:OpenDUNE-stats.txt
debug_stats=1
; tests: Play a Game starts with this mission (5+ = large 62x62 maps), 0 = from the start
debug_start_scenario=5
; no intro at the start (Replay Introduction still plays it)
skip_intro=1
